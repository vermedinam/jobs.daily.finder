name: Daily job finder
on:
  schedule:
    - cron: '0 17 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      date:
        description: 'Publication date YYYY-MM-DD (blank for today)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: jobs.daily.finder
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify collector
        run: python -m unittest discover -s tests -v
      - name: Collect and render verified jobs
        env:
          REPORT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$REPORT_DATE" ]; then
            python -m jobfinder.bot run --date "$REPORT_DATE"
          else
            python -m jobfinder.bot run
          fi
      - name: Persist report and state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md reports data/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update verified daily job report'
          git push
